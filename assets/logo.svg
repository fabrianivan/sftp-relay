<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- SFTP Relay: two sources (a server and a local folder) merge into one delivery. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36D6C4"/>
      <stop offset="1" stop-color="#2B6FDE"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#001B3A" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="sheen" cx="150" cy="96" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sheen)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- the two streams coming in -->
  <g opacity=".72" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round">
    <path d="M148 170 C 222 170, 204 256, 274 256"/>
    <path d="M148 342 C 222 342, 204 256, 274 256"/>
  </g>
  <!-- where they come from -->
  <circle cx="148" cy="170" r="35" fill="#FFFFFF"/>
  <circle cx="148" cy="342" r="35" fill="#FFFFFF"/>
  <!-- relayed on to the target -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274 256 H 378"/>
    <path d="M332 196 L 394 256 L 332 316"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
